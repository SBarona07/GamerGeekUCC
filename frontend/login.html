<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerGekk UCC - Iniciar Sesión</title>
    <style>
        /* Estilos Modo Oscuro Gamer en armonía con tu tienda */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #1f2833;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #b545ff;
        }
        .logo {
            font-weight: bold;
            font-size: 1.4rem;
            color: #ffffff;
        }
        .logo span {
            color: lab(56.12% 77.49 -68.03);
        }
        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }
        .navbar a:hover {
            color: #b545ff;
        }
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 80px);
        }
        .login-box {
            background-color: #1f2833;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(111, 66, 193, 0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #b545ff;
            text-align: center;
        }
        .form-control {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b545ff;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bb45ff;
            background-color: #0b0c10;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 8px #8907d4;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .login-btn:hover {
            background-color: #5a32a3;
            box-shadow: 0 0 10px #6f42c1;
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
        .switch-register {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
        }
        .switch-register a {
            color: #e045ff;
            text-decoration: none;
        }
        .switch-register a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo">GamerGeek<span>UCC</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Volver a la Tienda</a></li>
            </ul>
        </nav>
    </header>

    <!-- FORMULARIO DE LOGUEO -->
    <div class="login-wrapper">
        <main class="login-box">
            <h2>Iniciar Sesión</h2>
            
            <!-- IDs amarrados perfectamente a tu app.js -->
            <form id="login-form">
                <div class="form-control">
                    <label for="usuario">Nombre de Usuario (Gamertag)</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="form-control">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="login-btn">Entrar al Sistema</button>
                
                <!-- Caja dinámica donde el JavaScript pintará los errores de credenciales -->
                <div id="error-message" class="error-msg"></div>
            </form>
            
            <div class="switch-register">
                ¿No tienes una cuenta aún? <a href="registro.html">Regístrate aquí</a>
            </div>
        </main>
    </div>

    <!-- 🚀 LA CONEXIÓN CRUCIAL CON TU ARCHIVO JAVASCRIPT CENTRAL -->
    <script src="js/app.js"></script>
</body>
</html>
