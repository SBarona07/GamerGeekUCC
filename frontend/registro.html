<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerGekk UCC - Registrarse</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        .register-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 160px);
            padding: 20px;
        }
        .register-box {
            background-color: #121824;
            border: 1px solid #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.15);
        }
        .register-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            color: #ffffff;
        }
        .form-control {
            margin-bottom: 18px;
        }
        .form-control label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
        }
        .form-control input {
            width: 100%;
            padding: 12px;
            background-color: #0b0e14;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-control input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
        }
        .register-btn {
            width: 100%;
            background: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
            color: #0b0e14;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.4);
            color: white;
        }
        .switch-login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        .switch-login a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
        }
        .switch-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo">SBarona707<span>UCC</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Volver a la Tienda</a></li>
            </ul>
        </nav>
    </header>

  <!-- FORMULARIO DE REGISTRO -->
    <div class="register-wrapper">
        <main class="register-box">
            <h2>Crear Cuenta Gamer</h2>
            
            <!-- Sincronizado dinámicamente con el app.js -->
            <form id="registro-form">
                <div class="form-control">
                    <label for="reg-username">Nombre de Usuario (Gamertag)</label>
                    <input type="text" id="reg-username" placeholder="Ej: MasterChief7" required>
                </div>
                <div class="form-control">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-control">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
                </div>
                <button type="submit" class="register-btn">Registrar nueva cuenta</button>
            </form>
            
            <div class="switch-login">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión aquí</a>
            </div>
        </main>
    </div>

    <!-- 🚀 LA CONEXIÓN CENTRALIZADA Y REAL CON TU JAVASCRIPT -->
    <script src="js/app.js"></script>
</body>
</html>
