<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerGeek UCC - Carrito de Compras</title>
    <!-- Bootstrap CSS indispensable para mantener la consistencia del diseño -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #0b0c10;
            --bg-tarjeta: #1f2833;
            --neon-cian: #45f3ff;
            --neon-morado: #bc13fe;
            --neon-morado-hover: #9a0ecf;
        }

        body {
            background-color: var(--bg-principal);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Barra de Navegación PixelVault Style */
        .navbar-gamer {
            background-color: var(--bg-tarjeta);
            border-bottom: 2px solid var(--neon-cian);
            padding: 15px 30px;
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.2);
        }

        .brand-title {
            color: var(--neon-cian);
            font-weight: 800;
            text-decoration: none;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(69, 243, 255, 0.5);
        }

        .btn-back {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid transparent;
            padding: 5px 15px;
            border-radius: 4px;
        }

        .btn-back:hover {
            color: var(--neon-cian);
            border-color: var(--neon-cian);
            text-shadow: 0 0 5px var(--neon-cian);
        }

        /* Títulos de sección */
        .seccion-titulo {
            font-weight: bold;
            position: relative;
            padding-left: 15px;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .seccion-titulo::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 4px;
            background-color: var(--neon-morado);
            box-shadow: 0 0 8px var(--neon-morado);
        }

        /* Tarjeta del Contenedor del Carrito */
        .cart-container {
            background: var(--bg-tarjeta);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        /* Estilos de la Tabla Gamer */
        .cart-table {
            background-color: transparent !important;
        }

        .cart-table th {
            color: var(--neon-cian) !important;
            border-bottom: 2px solid var(--neon-cian) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .cart-table td {
            color: #ffffff !important;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            padding: 20px 10px !important;
        }

        .juego-titulo {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .precio-texto {
            font-weight: 600;
            color: #a4b3c6;
        }

        .subtotal-texto {
            font-size: 18px;
            font-weight: bold;
            color: var(--neon-cian);
            text-shadow: 0 0 5px rgba(69, 243, 255, 0.3);
        }

        .und-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Botones de acción */
        .btn-quitar {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn-quitar:hover {
            color: #ffffff;
            background: #ff4d4d;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        .btn-limpiar {
            color: #a4b3c6;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn-limpiar:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border-color: #ffffff;
        }

        /* Caja de Cierre de Compra */
        .checkout-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .total-label {
            font-size: 16px;
            color: #a4b3c6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-monto {
            font-size: 28px;
            font-weight: 800;
            color: var(--neon-cian);
            text-shadow: 0 0 10px rgba(69, 243, 255, 0.4);
        }

        .btn-checkout {
            background-color: var(--neon-morado);
            color: white;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            transition: 0.3s;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(188, 19, 254, 0.3);
        }

        .btn-checkout:hover {
            background-color: var(--neon-morado-hover);
            box-shadow: 0 0 20px var(--neon-morado);
            transform: translateY(-2px);
        }
        
        .btn-checkout:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación PixelVault -->
    <nav class="navbar-gamer d-flex justify-content-between align-items-center">
        <a href="index.html" class="brand-title">GamerGekk UCC</a>
        <a href="index.html" class="btn-back">← Volver a la Tienda</a>
    </nav>

    <!-- Área de Contenido Principal -->
    <div class="cart-container" style="background: rgba(20, 14, 36, 0.8); border: 1px solid #bc13fe; padding: 30px; border-radius: 8px; margin-top: 20px; box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);">
    
    <h2 style="color: #ffffff; border-left: 4px solid #bc13fe; padding-left: 10px; margin-bottom: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">📋 Tu Carrito Gamer</h2>
    
    <table class="table" style="width: 100%; color: #ffffff; margin-bottom: 25px; border-collapse: collapse;">
        <thead>
            <tr style="border-bottom: 2px solid #45f3ff; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;">
                <th style="padding: 12px 8px; text-align: left; color: #45f3ff;">Portada</th>
                <th style="padding: 12px 8px; text-align: left; color: #45f3ff;">Videojuego</th>
                <th style="padding: 12px 8px; text-align: left; color: #45f3ff;">Precio</th>
                <th style="padding: 12px 8px; text-align: left; color: #45f3ff;">Cantidad</th>
                <th style="padding: 12px 8px; text-align: left; color: #45f3ff;">Subtotal</th>
                <th style="padding: 12px 8px; text-align: left; color: #45f3ff;">Acción</th>
            </tr>
        </thead>
        <tbody id="lista-carrito-cuerpo">
            <!-- JavaScript se encargará de rellenar las filas de forma dinámica aquí -->
        </tbody>
    </table>

    <!-- 📊 SECCIÓN DE CIERRE Y TOTALES -->
    <div class="cart-summary-box" style="background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(69, 243, 255, 0.2); padding: 20px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #aaaaaa; font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px;">Total a Pagar (USD):</span>
        <span id="cart-total-usd" style="color: #45f3ff; font-size: 32px; font-weight: 900; text-shadow: 0 0 10px rgba(69, 243, 255, 0.4);">$0.00</span>
    </div>

    <!-- 🚀 BOTÓN DE ACCIÓN COMPACTO INTERACTIVO -->
    <button onclick="procesarCompraFinal()" style="width: 100%; background: linear-gradient(135deg, #bc13fe 0%, #700fff 100%); color: #ffffff; border: none; padding: 15px; font-size: 16px; font-weight: 800; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(188, 19, 254, 0.4);" onmouseover="this.style.opacity='0.9'; this.style.boxShadow='0 6px 20px rgba(188, 19, 254, 0.6)';" onmouseout="this.style.opacity='1'; this.style.boxShadow='0 4px 15px rgba(188, 19, 254, 0.4)';">
        🚀 Confirmar Compra Gamer
    </button>
</div>

    <!-- Script Integrador de Lógica General -->
    <script src="js/app.js"></script>
</body>
</html>
