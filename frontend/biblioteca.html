<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerGeek UCC - Mi Biblioteca</title>
    <style>
        /* Mantenemos tus estilos oscuros de forma idéntica */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: #0b0c10;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #6f42c1; /* Tu línea divisoria morada */
        }
        .logo {
            font-weight: bold;
            font-size: 1.5rem;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .logo span {
            color: #6f42c1; /* Tu UCC morado */
        }
        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 30px;
        }
        .navbar a {
            color: #a8b2c1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s;
        }
        .navbar a:hover, .navbar a.active {
            color: #6f42c1;
        }

        /* DISEÑO DE LA BIBLIOTECA DE LLAVES */
        .library-container {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #a8b2c1;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .library-card {
            background-color: #1f2833;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #333f4d;
            display: flex;
            flex-direction: column;
        }
        .card-img {
            height: 180px;
            background-size: cover;
            background-position: center;
        }
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            color: #ffffff;
        }
        .key-box {
            background-color: #0b0c10;
            border: 1px dashed #6f42c1;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            color: #45f3ff;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: auto;
            letter-spacing: 1px;
        }
        .error-msg {
            color: #a8b2c1;
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN ORIGINAL -->
    <header class="navbar">
        <div class="logo">GamerGeek<span>UCC</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Tienda</a></li>
                <li><a href="biblioteca.html" class="active">Mi Biblioteca</a></li>
                <!-- El guardián se encargará de mostrarlo si inicia sesión el administrador -->
                <li id="nav-admin" style="display: none;"><a href="admin.html">Panel Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- CUADRÍCULA DINÁMICA DE LA BIBLIOTECA -->
    <main class="library-container">
        <h2>Mi Colección Digital</h2>
        <div class="subtitle">Gestiona tus licencias y descarga tus claves globales de activación.</div>
        
        <div id="library-games-container" class="library-grid">
            <p class="error-msg">Conectando con el servidor de licencias...</p>
        </div>
    </main>

    <!-- CONEXIÓN CENTRALIZADA JAVASCRIPT -->
    <script src="js/app.js"></script>
</body>
</html>
